//message.proto
syntax = "proto3";
package im;

enum Cmd {
  CMD_UNKNOWN            = 0;
  CMD_REGISTER_REQ       = 1;
  CMD_REGISTER_RES       = 2;
  CMD_LOGIN_REQ          = 3;
  CMD_LOGIN_RES          = 4;
  CMD_SINGLE_MSG         = 5;
  CMD_GROUP_MSG          = 6;
  CMD_GET_HISTORY_REQ    = 7;
  CMD_GET_HISTORY_RES    = 8;
  CMD_CLEAR_UNREAD_REQ   = 9;
  CMD_CLEAR_UNREAD_RES   = 10;
  CMD_HEARTBEAT          = 11;
  CMD_QUIT_REQ           = 12;
  CMD_QUIT_RES           = 13;
  CMD_GET_CONTACTS_REQ   = 14;
  CMD_GET_CONTACTS_RES   = 15;
}

message Contact {
  string user_id = 1;
  string username = 2; 
  bool is_group = 3;
  string alias = 4;
}

message ContactResponse {
  int32 status = 1;
  repeated Contact contacts = 2;
}

message Header {
  int32  cmd    = 1;
  int64  seq    = 2;
  int32  status = 3;
}

message Message {
  Header header = 1;
  bytes  body   = 2;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message ContactRequest{
  string user_id = 1;
}

message RegisterResponse {
  int32 status = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  int32  status  = 1;
  string user_id = 2;
  string username = 3;   // 确保存在
}

message ChatMessage {
  string sender   = 1;
  string receiver = 2;
  string group_id = 3;
  string content  = 4;
}

message HistoryRequest {
  string peer_id  = 1;
  bool   is_group = 2;
  int64  start    = 3;
  int32  count    = 4;
}

message HistoryMessage {
  int64  msg_id    = 1;
  string sender    = 2;
  string receiver  = 3;
  string group_id  = 4;
  string content   = 5;
  int64  timestamp = 6;
}

message HistoryResponse {
  int32  status = 1;
  repeated HistoryMessage messages = 2;
}

message ClearUnreadRequest {
  string peer_id  = 1;
  bool   is_group = 2;
}

message ClearUnreadResponse {
  int32 status = 1;
}